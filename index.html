<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet"  href="style.css">	
</head>

<body>

    <audio id="wrong-sound">
        <source src="ohno.ogg" type="audio/ogg">
        <source src="ohno.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    
      <audio id="right-sound">
        <source src="success.ogg" type="audio/ogg">
        <source src="success.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    
<form method="post" id="login-form">
  
    <div class="imgcontainer">
        <img src="godis.jpg" alt="Avatar" class="avatar" id="image">      
        <p id="image-text">Lös alla 3 kluringarna och skriv in svaren här.</p>
    </div>

    

  <div class="container">
    
    <label for="uname"><b>Lösenord:</b></label>
    <input type="text" placeholder="Lovis svar:"  name="answer_lovis">
    <input type="text" placeholder="Hugos svar:"  name="answer_hugo">
    <input type="text" placeholder="Theos svar:"  name="answer_theo">
        
    <button id="login-form-submit"><b>Lämna svar</b></button>
  </div>

</form>
   
    <script>
   
    const loginForm = document.getElementById("login-form");
    const loginButton = document.getElementById("login-form-submit");
  
	let config;

    // Load answers and clue
    fetch("config.json")
        .then(response => {
            if (!response.ok) {
                throw new Error("Could not load config.json");
            }

            return response.json();
        })
        .then(data => {
            config = data;
        })
        .catch(error => {
			console.error("Failed to load config.json:", error);
		});
  
    loginButton.addEventListener("click", (e) => {
        e.preventDefault();
		
		if (!config) {
            alert("Kluringarna kunde inte laddas. Försök igen.");
            return;
        }
        
        const answer_lovis = loginForm.answer_lovis.value;
        const answer_hugo = loginForm.answer_hugo.value;
        const answer_theo = loginForm.answer_theo.value;

        if (answer_lovis.toLowerCase() == config.lovis.toLowerCase() && answer_hugo.toLowerCase() == config.hugo.toLowerCase() && answer_theo.toLowerCase() == config.theo.toLowerCase()) {            
			document.getElementById("image").style.display = "none";
            document.getElementById("image-text").innerHTML = config.clue;
            document.getElementById("right-sound").play();
            

        } else {
            document.getElementById("image").src = "wrong.gif"
			document.getElementById("image").style.display = "block";
            document.getElementById("image-text").innerHTML = "Fel lösenord! Försök igen!"
            document.getElementById("wrong-sound").play();
        }
    })
    </script>
  </body>
  
  </html>
</body>

</html>
